name: Taiwan Stock Daily Breakout Scan

on:
  workflow_dispatch: # 由外部 trigger (cron-job.org) 觸發：可設定盤中 (如 10:00, 11:30, 13:00) 與盤後 (14:00) 多時段

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install yfinance pandas tabulate requests

      - name: Get Taipei Date for Cache
        id: tw_date
        run: |
          echo "date=$(TZ='Asia/Taipei' date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Restore Intraday Dedup Cache
        uses: actions/cache/restore@v4
        with:
          path: notified_intraday_cache.json
          key: intraday-dedup-${{ steps.tw_date.outputs.date }}-${{ github.run_id }}
          restore-keys: |
            intraday-dedup-${{ steps.tw_date.outputs.date }}-

      - name: Run Stock Breakout Scan (Auto Intraday / Post-Close)
        run: |
          python tw_stock_breakout_monitor.py

      - name: Save Intraday Dedup Cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: notified_intraday_cache.json
          key: intraday-dedup-${{ steps.tw_date.outputs.date }}-${{ github.run_id }}
