name: Taiwan Stock Daily Breakout Scan

on:
  workflow_dispatch: # 僅由外部 trigger (cron-job.org) 於每日 14:00 觸發，已移除 schedule 徹底杜絕晚上重複執行！

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install yfinance pandas tabulate requests

      - name: Run Stock Breakout Scan
        run: |
          python tw_stock_breakout_monitor.py
